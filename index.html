<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <input type="text" class="display"
            oninput="this.value = this.value.replace(/[+\−\×\÷\-\*\/x]/g, '').replace(/(\..*?)\..*/g, '$1').replace(/^0[^.]/, '0');" autofocus/>
        <div class="buttons">
            <div class="row">
                <button onclick="clearEntry()">C</button>
                <button onclick="deleteLast()">&#x232B;</button>
                <button onclick="percent()">&percnt;</button>
                <button id="operation" class="operator" value="&divide;">&divide;</button>
            </div>
            <div class="row">
                <button class="number" value="7">7</button>
                <button class="number" value="8">8</button>
                <button class="number" value="9">9</button>
                <button id="operation" class="operator" value="&times;">&times;</button>
            </div>
            <div class="row">
                <button class="number" value="4">4</button>
                <button class="number" value="5">5</button>
                <button class="number" value="6">6</button>
                <button id="operation" class="operator" value="&minus;">&minus;</button>
            </div>
            <div class="row">
                <button class="number" value="1">1</button>
                <button class="number" value="2">2</button>
                <button class="number" value="3">3</button>
                <button id="operation" class="operator" value="&plus;">&plus;</button>
            </div>
            <div class="row">
                <button class="number" value="0">0</button>
                <button class="number" value="00">00</button>
                <button class="number" onclick="appendDecimal('.')">&#46;</button>
                <button class="operator" onclick="operate()">&equals;</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
